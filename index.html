<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#315c53">
  <meta name="description" content="毎月・毎年の固定費を見える化する個人用管理アプリ">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>たぬすく帳</title>
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">SUBSCRIPTION MANAGER</p>
      <h1>たぬすく帳</h1>
    </div>
    <div class="header-actions">
      <button id="open-menu-button" class="menu-button" type="button" aria-haspopup="dialog">☰ メニュー</button>
    </div>
  </header>

  <nav class="tab-bar" role="tablist" aria-label="表示切り替え">
    <button id="list-tab" class="tab-button active" type="button" role="tab" aria-selected="true" aria-controls="list-panel">LIST</button>
    <button id="category-tab" class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="category-panel" tabindex="-1">CATEGORY</button>
  </nav>

  <main class="container">
    <div id="list-panel" class="tab-panel list-panel" role="tabpanel" aria-labelledby="list-tab">
      <section class="summary-grid" aria-label="全体集計">
        <article class="summary-card">
          <span>月額換算</span>
          <strong id="monthly-total">0円</strong>
        </article>
        <article class="summary-card accent">
          <span>年間総額</span>
          <strong id="yearly-total">0円</strong>
        </article>
      </section>

      <section aria-labelledby="list-heading">
        <div class="section-heading list-heading">
          <div><h2 id="list-heading">登録中のサービス</h2></div>
          <span id="item-count" class="count-badge">0件</span>
        </div>
        <div id="subscription-list" class="subscription-list"></div>
      </section>
    </div>

    <div id="category-panel" class="tab-panel" role="tabpanel" aria-labelledby="category-tab" hidden>
      <section class="panel" aria-labelledby="category-heading">
        <div class="section-heading">
          <div><h2 id="category-heading">カテゴリ別支出</h2></div>
        </div>
        <div class="period-switch" role="tablist" aria-label="集計期間">
          <button id="monthly-period" class="period-button active" type="button" role="tab" aria-selected="true">月額換算</button>
          <button id="yearly-period" class="period-button" type="button" role="tab" aria-selected="false">年額換算</button>
        </div>
        <article class="chart-card single-chart">
          <div class="chart-wrap"><canvas id="category-chart" width="360" height="340" aria-label="カテゴリ別月額換算の円グラフ"></canvas></div>
        </article>
        <div id="category-summary" class="category-summary"></div>
      </section>
    </div>
  </main>

  <button id="open-form-button" class="fab" type="button" aria-label="固定費を追加">＋</button>

  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
    <div class="settings-panel">
      <div class="dialog-heading settings-heading">
        <div><p class="eyebrow">SETTINGS</p><h2 id="settings-title">メニュー</h2></div>
        <button id="close-menu-button" class="icon-button" type="button" aria-label="メニューを閉じる">×</button>
      </div>

      <section class="settings-section" aria-labelledby="rate-title">
        <h3 id="rate-title">為替レート</h3>
        <p>USD建ての料金を円換算するために使います。</p>
        <form id="rate-form" class="rate-form">
          <label for="exchange-rate">1 USD =</label>
          <input id="exchange-rate" name="exchangeRate" type="number" min="0.01" step="0.01" inputmode="decimal" required>
          <span>円</span>
          <button class="secondary-button" type="submit">保存</button>
        </form>
        <p id="rate-message" class="save-message" aria-live="polite"></p>
      </section>

      <section class="settings-section" aria-labelledby="data-heading">
        <h3 id="data-heading">データ管理</h3>
        <p>バックアップ、復元、表計算ソフト向けの書き出しができます。</p>
        <div class="data-actions">
          <button id="backup-button" class="secondary-button" type="button">バックアップを保存</button>
          <button id="restore-button" class="ghost-button" type="button">バックアップから復元</button>
          <button id="csv-button" class="ghost-button" type="button">CSVで書き出す</button>
        </div>
        <input id="restore-file" class="visually-hidden" type="file" accept="application/json,.json">
        <p id="data-message" class="data-message" aria-live="polite"></p>
      </section>
    </div>
  </dialog>

  <dialog id="subscription-dialog">
    <form id="subscription-form" method="dialog">
      <div class="dialog-heading">
        <h2 id="form-title">サブスクリプションを追加</h2>
        <button id="close-form-button" class="icon-button" type="button" aria-label="閉じる">×</button>
      </div>
      <input id="subscription-id" type="hidden">
      <div class="form-grid">
        <label class="full">サービス名<input id="service-name" maxlength="80" autocomplete="organization" required></label>
        <label>料金<input id="price" type="number" min="0" step="0.01" inputmode="decimal" required></label>
        <label>通貨<select id="currency" required><option value="JPY">日本円（JPY）</option><option value="USD">米ドル（USD）</option></select></label>
        <label>更新周期<select id="cycle" required><option value="monthly">毎月</option><option value="yearly">毎年</option></select></label>
        <label>次回更新日<input id="next-renewal" type="date" required></label>
        <label class="full">支払方法<input id="payment-method" list="payment-method-options" maxlength="80" placeholder="候補から選択、または自由入力"></label>
        <datalist id="payment-method-options"><option value="dカード"><option value="銀行引き落とし"></datalist>
        <label class="full">カテゴリ<input id="category" list="category-options" maxlength="40" placeholder="候補から選択、または自由入力" required></label>
        <datalist id="category-options"><option value="生活"><option value="仕事"><option value="娯楽"></datalist>
      </div>
      <p id="form-error" class="form-error" aria-live="polite"></p>
      <div class="form-actions">
        <button id="cancel-button" class="ghost-button" type="button">キャンセル</button>
        <button class="primary-button" type="submit">保存する</button>
      </div>
    </form>
  </dialog>

  <noscript>このアプリを利用するにはJavaScriptを有効にしてください。</noscript>
  <script src="app.js"></script>
</body>
</html>
